<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- NiteLite app icon: a lens, white line rings on black, with a neon aperture.
       Full-bleed square; macOS applies the rounded-square mask. -->
  <defs>
    <clipPath id="aperture"><circle r="232"/></clipPath>
    <mask id="hole">
      <circle r="232" fill="#fff"/>
      <polygon fill="#000" points="150.0,0.0 75.0,129.9 -75.0,129.9 -150.0,0.0 -75.0,-129.9 75.0,-129.9"/>
    </mask>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#0b0b0b"/>
  <g transform="translate(512 512)">
    <circle r="378" fill="none" stroke="#f4f4f1" stroke-width="18"/>
    <circle r="340" fill="none" stroke="#f4f4f1" stroke-width="7" stroke-dasharray="4 24"/>
    <circle r="296" fill="none" stroke="#f4f4f1" stroke-width="18"/>
    <!-- light through the aperture, with a soft neon bloom -->
    <polygon fill="#ccff00" opacity="0.75" filter="url(#glow)" points="150.0,0.0 75.0,129.9 -75.0,129.9 -150.0,0.0 -75.0,-129.9 75.0,-129.9"/>
    <circle r="232" fill="#ccff00"/>
    <g clip-path="url(#aperture)">
      <circle r="232" fill="#1c1c1c" mask="url(#hole)"/>
      <g stroke="#4a4a47" stroke-width="7"><line x1="150.0" y1="0.0" x2="-178.6" y2="618.1"/><line x1="75.0" y1="129.9" x2="-624.6" y2="154.3"/><line x1="-75.0" y1="129.9" x2="-445.9" y2="-463.7"/><line x1="-150.0" y1="0.0" x2="178.6" y2="-618.1"/><line x1="-75.0" y1="-129.9" x2="624.6" y2="-154.3"/><line x1="75.0" y1="-129.9" x2="445.9" y2="463.7"/></g>
    </g>
    <circle r="232" fill="none" stroke="#f4f4f1" stroke-width="18"/>
  </g>
</svg>
